# Dependency update automation for this repository.
#
# The CI and release-image workflows pin every third-party GitHub Action to a
# full-length commit SHA, with a readable version comment on the same line
# (e.g. `uses: actions/checkout@11d5960a...# v4.4.0`). Dependabot resolves the
# SHA pin against that version comment and opens a PR when a newer release of
# the action exists, so the pins are bumped mechanically instead of by hand.
#
# This is the automation that the manual SHA-pin pass (see the deploy issue
# "pin release inputs") requires to stay current.

version: 2
updates:
  # Bump third-party GitHub Actions used by the CI and release workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
